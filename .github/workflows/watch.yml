name: watch

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run a long backfill instead of the incremental update"
        type: boolean
        default: false
      chain:
        description: "Chain or group for backfill (eth, tron, sol, safe, msw, all ...)"
        default: "all"
      budget_sec:
        description: "Time budget per source in seconds (backfill only)"
        default: "1500"

permissions:
  contents: write

concurrency:
  group: freezewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # a hang must never block the queue for long; the Run step has its own, shorter timeout so the database is still saved
    timeout-minutes: ${{ inputs.backfill && 50 || 15 }}
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore data from the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
        continue-on-error: true

      - name: Restore the database (release data-latest, fallback data branch)
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          mkdir -p data
          rm -rf _rel _try && mkdir _rel _try
          # a candidate is used only if it unpacks and passes quick_check; otherwise the next one is tried
          try_db() {  # $1 = .gz file, $2 = label
            rm -f data/freezewatch.sqlite
            gunzip -c "$1" > data/freezewatch.sqlite 2>/dev/null || { echo "  $2: does not unpack"; return 1; }
            r=$(python3 -c 'import sqlite3; print(sqlite3.connect("data/freezewatch.sqlite").execute("pragma quick_check").fetchone()[0])' 2>&1 || true)
            [ "$r" = "ok" ] || { echo "  $2: damaged ($r)"; rm -f data/freezewatch.sqlite; return 1; }
            cp "$1" _rel/freezewatch.sqlite.gz; echo "restored from $2"; echo "source=$2" >> "$GITHUB_OUTPUT"
          }
          # order: current copy, half-finished upload of a previous run, newest daily backups, legacy data branch
          backups=$(gh api "repos/$REPO/releases/tags/data-latest" --jq '[.assets[].name | select(startswith("freezewatch-backup-"))] | sort | reverse | .[]' 2>/dev/null || true)
          restored=""
          for name in freezewatch.sqlite.gz freezewatch-new.sqlite.gz $backups; do
            if gh release download data-latest -R "$REPO" -p "$name" -D _try --clobber 2>/dev/null && try_db "_try/$name" "release:$name"; then restored=1; break; fi
          done
          if [ -z "$restored" ] && [ -f _data/data/freezewatch.sqlite.gz ] && try_db _data/data/freezewatch.sqlite.gz "data branch"; then restored=1; fi
          ls -la data | head
          if [ -n "$restored" ]; then
            [ "$name" = "freezewatch.sqlite.gz" ] || echo "::warning::Main database copy missing or damaged, restored from a fallback; check the release data-latest"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.backfill }}" = "true" ]; then
            echo "::warning::No database found, starting an empty one (backfill run)"; echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # an incremental run on an empty database rescans all history, never finishes and never saves (Nov 2026 outage)
            echo "::error::No database in release data-latest or the data branch. Restore freezewatch.sqlite.gz to the release, or run with backfill=true."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # React UI (web/): built into site/ (index.html + assets/) before the pipeline runs, so a Node failure fails fast.
      # The Python render keeps the classic page as site/classic.html and never overwrites the React index.html.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the React UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run
        # shorter than the job timeout: a run that overshoots fails here and the upload step below still saves its progress
        timeout-minutes: ${{ inputs.backfill && 40 || 10 }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SAFE_API_KEY: ${{ secrets.SAFE_API_KEY }}
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          FREEZEWATCH_RUN_DEADLINE_SEC: "420"
          FREEZEWATCH_BUDGET_SEC: "300"
          FREEZEWATCH_SOL_HISTORY_SEC: "60"
          ANALYTICS_BUDGET_SEC: "50"
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m freezewatch backfill --chain "${{ inputs.chain }}" --budget "${{ inputs.budget_sec }}" || true
          fi
          python -m freezewatch run

      - name: Upload the database to the data-latest release
        # also after a failed / timed-out Run, so progress is kept and the next run does not start over
        if: ${{ !cancelled() && steps.restore.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          [ -s data/freezewatch.sqlite ] || { echo "::warning::no database to upload"; exit 0; }
          # opening the database rolls back a transaction interrupted by a timeout; never upload a damaged file
          python - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect("data/freezewatch.sqlite")
          r = c.execute("pragma integrity_check").fetchone()[0]
          c.close()
          print("integrity_check:", r)
          sys.exit(0 if r == "ok" else 1)
          PY
          rm -f data/freezewatch.sqlite-journal
          # the database lives in a release asset (2 GB limit, no git history), not in the data branch
          gzip -9 -n -c data/freezewatch.sqlite > _db.sqlite.gz
          if [ -f _rel/freezewatch.sqlite.gz ] && cmp -s _db.sqlite.gz _rel/freezewatch.sqlite.gz; then echo "database unchanged"; exit 0; fi
          gh release view data-latest -R "$REPO" >/dev/null 2>&1 || gh release create data-latest -R "$REPO" --title "Data snapshot (auto-updated)" --prerelease --latest=false --notes "Auto-updated SQLite database (gzip) written by the watch workflow every run. Download: freezewatch.sqlite.gz, then gunzip."
          # never delete the good copy before the new one is uploaded (a 502 after --clobber lost the database once):
          # upload under a temporary name, then delete the old asset and rename the new one
          cp _db.sqlite.gz freezewatch-new.sqlite.gz
          ok=""
          for i in 1 2 3; do
            if gh release upload data-latest freezewatch-new.sqlite.gz -R "$REPO" --clobber; then ok=1; break; fi
            echo "upload attempt $i failed"; sleep $((i * 15))
          done
          [ -n "$ok" ] || { echo "::error::database upload failed, the previous copy is kept"; exit 1; }
          assets=$(gh api "repos/$REPO/releases/tags/data-latest" --jq '.assets[] | "\(.id) \(.name)"')
          new_id=$(echo "$assets" | awk '$2=="freezewatch-new.sqlite.gz"{print $1}')
          old_id=$(echo "$assets" | awk '$2=="freezewatch.sqlite.gz"{print $1}')
          [ -n "$old_id" ] && gh api -X DELETE "repos/$REPO/releases/assets/$old_id"
          gh api -X PATCH "repos/$REPO/releases/assets/$new_id" -f name=freezewatch.sqlite.gz --jq '"\(.name) \(.size)"'
          # one dated backup per day, last 7 kept: even a lost or damaged main copy costs at most a day of data
          today="freezewatch-backup-$(date -u +%F).sqlite.gz"
          backups=$(gh api "repos/$REPO/releases/tags/data-latest" --jq '.assets[] | select(.name | startswith("freezewatch-backup-")) | "\(.name) \(.id)"' | sort -r)
          if ! echo "$backups" | grep -q "^$today "; then
            cp _db.sqlite.gz "$today"
            if gh release upload data-latest "$today" -R "$REPO"; then
              echo "backup $today uploaded"
              echo "$backups" | awk 'NF' | tail -n +7 | while read -r n id; do gh api -X DELETE "repos/$REPO/releases/assets/$id" && echo "old backup $n removed"; done
            else
              echo "::warning::daily backup upload failed (main copy is saved)"
            fi
          fi

      - name: Publish to the data branch (single orphan commit)
        id: publish
        run: |
          rm -rf _pub && mkdir _pub && cp -r data site _pub/
          rm -f _pub/data/freezewatch.sqlite _pub/data/freezewatch.sqlite.gz   # database is in the release
          ls -la _pub/data | awk '{print $5, $9}'
          if [ -d _data ] && diff -rq --exclude=.git _data/data _pub/data >/dev/null 2>&1 && diff -rq --exclude=.git _data/site _pub/site >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes"; exit 0
          fi
          cd _pub
          git init -q -b data
          git config user.name "freezewatch-bot"
          git config user.email "freezewatch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: update"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Telegram notice when the monitor breaks (1st failed run, then after ~1 h, ~6 h, ~24 h) and when it recovers.
  # Silent failures are what let the Nov 2026 outage run for 30 hours.
  notify:
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Notify on breakage / recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RESULT: ${{ needs.run.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # streak of non-successful runs before this one (this run is still in progress, so it is not listed)
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/watch.yml/runs?status=completed&per_page=100" \
                   --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .conclusion] | (index("success") // length)' || echo 0)
          echo "result=$RESULT, failed runs before this one: $prev"
          msg=""
          if [ "$RESULT" = "success" ]; then
            [ "$prev" -gt 0 ] && msg="✅ freezewatch recovered after $prev failed run(s)."
          else
            streak=$((prev + 1))
            case "$streak" in 1|6|36|144) msg="🚨 freezewatch is not updating: $streak failed run(s) in a row (last: $RESULT). Data and alerts are stale.";; esac
          fi
          [ -n "$msg" ] || { echo "nothing to send"; exit 0; }
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || { echo "::warning::$msg (Telegram not configured)"; exit 0; }
          curl -sS -m 20 -o /dev/null -w "telegram: %{http_code}\n" "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${msg}
          ${RUN_URL}" --data-urlencode "disable_web_page_preview=true"

  pages:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
