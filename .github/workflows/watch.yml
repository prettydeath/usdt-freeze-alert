name: watch

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run a long backfill instead of the incremental update"
        type: boolean
        default: false
      chain:
        description: "Chain or group for backfill (eth, tron, sol, safe, msw, all ...)"
        default: "all"
      budget_sec:
        description: "Time budget per source in seconds (backfill only)"
        default: "1500"

permissions:
  contents: write

concurrency:
  group: freezewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.backfill == 'true' && 45 || 12 }}   # a hang must never block the queue for long
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore data from the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
        continue-on-error: true

      - run: |
          mkdir -p data
          if [ -f _data/data/freezewatch.sqlite.gz ]; then gunzip -c _data/data/freezewatch.sqlite.gz > data/freezewatch.sqlite
          elif [ -f _data/data/freezewatch.sqlite ]; then cp _data/data/freezewatch.sqlite data/; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # React UI (web/): built into site/ (index.html + assets/) before the pipeline runs, so a Node failure fails fast.
      # The Python render keeps the classic page as site/classic.html and never overwrites the React index.html.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the React UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SAFE_API_KEY: ${{ secrets.SAFE_API_KEY }}
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          FREEZEWATCH_RUN_DEADLINE_SEC: "420"
          FREEZEWATCH_BUDGET_SEC: "300"
          FREEZEWATCH_SOL_HISTORY_SEC: "60"
          ANALYTICS_BUDGET_SEC: "50"
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python -m freezewatch backfill --chain "${{ github.event.inputs.chain }}" --budget "${{ github.event.inputs.budget_sec }}" || true
          fi
          python -m freezewatch run

      - name: Publish to the data branch (single orphan commit)
        id: publish
        run: |
          rm -rf _pub && mkdir _pub && cp -r data site _pub/
          # GitHub rejects files > 100 MB: publish the database gzip-compressed (-n = deterministic bytes)
          gzip -9 -n -c _pub/data/freezewatch.sqlite > _pub/data/freezewatch.sqlite.gz && rm _pub/data/freezewatch.sqlite
          ls -la _pub/data | awk '{print $5, $9}'
          if [ -d _data ] && diff -rq --exclude=.git _data/data _pub/data >/dev/null 2>&1 && diff -rq --exclude=.git _data/site _pub/site >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes"; exit 0
          fi
          cd _pub
          git init -q -b data
          git config user.name "freezewatch-bot"
          git config user.email "freezewatch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: update"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          echo "changed=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
